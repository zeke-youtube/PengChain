name: PengMiner Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        "apps/pengminer/**",
        "client/**",
        ".github/workflows/pengminer-windows.yml",
      ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build server for integration tests
        working-directory: server
        run: npm ci && npm run build && npm test
      - name: Install desktop dependencies
        working-directory: apps/pengminer
        run: npm ci
      - name: Frontend checks
        working-directory: apps/pengminer
        run: npm run build && npm run lint && npm test
      - name: Shared CLI regression tests
        run: cargo test --locked --manifest-path client/Cargo.toml
      - name: Desktop core integration tests
        run: cargo test --locked --manifest-path apps/pengminer/src-tauri/Cargo.toml --no-default-features
      - name: Build Windows installer
        working-directory: apps/pengminer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: PengMiner-Windows-NSIS
          path: apps/pengminer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
