<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Logs | PengChain</title><style>body{margin:0;background:#07110f;color:#effff7;font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid #1b3930}a{color:#45e7a0;text-decoration:none}.brand{font-weight:800}.hero{padding:56px 0 28px}.eyebrow{color:#45e7a0;font-size:11px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:52px;line-height:1;margin:12px 0}.muted{color:#8db2a4}.log{padding:16px 0;border-bottom:1px solid #1b3930}.log strong{display:block;color:#45e7a0}.log p{margin:5px 0;color:#8db2a4;overflow-wrap:anywhere}@media(max-width:600px){h1{font-size:42px}}</style></head><body><header><div class="wrap"><div class="brand">🐧 <a href="/">PENGCHAIN</a> / PUBLIC LOGS</div></div></header><main class="wrap"><div class="hero"><div class="eyebrow">Tamper-evident activity</div><h1>What the network is doing.</h1><p class="muted">Public audit records from the authoritative PengChain server.</p></div><div id="logs"><p class="muted">Loading public activity…</p></div></main><script>const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/blockchain/api/logs?limit=100').then(r=>{if(!r.ok)throw Error();return r.json()}).then(logs=>document.querySelector('#logs').innerHTML=logs.map(log=>`<article class="log"><strong>${esc(log.eventType.replaceAll('.', ' '))}</strong><span class="muted">${esc(new Date(log.createdAt).toLocaleString())}</span><p>${esc(log.payload)}</p></article>`).join('')||'<p class="muted">No public activity yet.</p>').catch(()=>document.querySelector('#logs').innerHTML='<p class="muted">Public logs are temporarily unavailable.</p>');</script></body></html>
