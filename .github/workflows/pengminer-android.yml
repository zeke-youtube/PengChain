name: PengMiner Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      PENGMINER_ANDROID_KEYSTORE_BASE64: ${{ secrets.PENGMINER_ANDROID_KEYSTORE_BASE64 }}
      PENGMINER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PENGMINER_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/pengminer/package-lock.json
            server/package-lock.json
      - name: Install shared desktop UI
        working-directory: apps/pengminer
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore optional private Android signing key
        shell: bash
        run: |
          if [ -n "$PENGMINER_ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$PENGMINER_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pengminer.jks"
            chmod 600 "$RUNNER_TEMP/pengminer.jks"
            echo "PENGMINER_ANDROID_KEYSTORE=$RUNNER_TEMP/pengminer.jks" >> "$GITHUB_ENV"
          fi
      - name: Test, lint, and build APK
        working-directory: apps/pengminer-android
        shell: bash
        run: |
          mkdir -p distribution
          if [ -n "$PENGMINER_ANDROID_KEYSTORE" ]; then
            ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
            cp app/build/outputs/apk/release/app-release.apk distribution/PengMiner-Android.apk
          else
            ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk distribution/PengMiner-Android-debug.apk
          fi
      - name: Build and test real server
        working-directory: server
        run: npm ci && npm run build && npm test
      - name: Verify Java miner against real HTTPS server
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/json.jar"
          python3 apps/pengminer-android/tests/server-proof.py "$RUNNER_TEMP/json.jar"
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify shared UI and Android Keystore on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/pengminer-android
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            python3 tests/device-proof.py
      - uses: actions/upload-artifact@v4
        with:
          name: PengMiner-Android
          path: apps/pengminer-android/distribution/*.apk
          if-no-files-found: error
