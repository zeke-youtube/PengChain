# Use this file only for a locally-managed tunnel.
# For a remotely-managed tunnel, configure the public hostname in the
# Cloudflare dashboard and use CLOUDFLARE_TUNNEL_TOKEN with compose.cloudflare.yaml.
tunnel: replace-with-tunnel-id
credentials-file: /etc/cloudflared/replace-with-tunnel-id.json

ingress:
  - hostname: peng.example.com
    service: http://pengchain:3000
  - service: http_status:404
