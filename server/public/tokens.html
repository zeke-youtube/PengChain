<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tokens | PengChain</title><style>body{margin:0;background:#07110f;color:#effff7;font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid #1b3930}a{color:#45e7a0;text-decoration:none}.brand{font-weight:800}.hero{padding:56px 0 28px}.eyebrow{color:#45e7a0;font-size:11px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:52px;line-height:1;margin:12px 0}.muted{color:#8db2a4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{padding:20px;border:1px solid #1b3930;border-radius:16px;background:#0d1d19}.symbol{color:#45e7a0;font-weight:800;letter-spacing:.08em}.value{margin-top:8px;font-size:13px;color:#8db2a4}@media(max-width:600px){h1{font-size:42px}}</style></head><body><header><div class="wrap"><div class="brand">🐧 <a href="/">PENGCHAIN</a> / TOKENS</div></div></header><main class="wrap"><div class="hero"><div class="eyebrow">Token registry</div><h1>Explore the ecosystem.</h1><p class="muted">Custom assets registered by PengChain wallets.</p></div><div class="grid" id="tokens"><div class="muted">Loading tokens…</div></div></main><script>const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/blockchain/api/token?limit=100').then(r=>{if(!r.ok)throw Error();return r.json()}).then(tokens=>document.querySelector('#tokens').innerHTML=tokens.map(t=>`<article class="card"><div class="symbol">${esc(t.symbol)}</div><h2>${esc(t.name)}</h2><div class="value">Difficulty ${esc(t.difficulty)} · ${t.mineable?'Mineable':'Issued'}</div><div class="value">${esc(t.id)}</div></article>`).join('')||'<p class="muted">No tokens registered yet.</p>').catch(()=>document.querySelector('#tokens').innerHTML='<p class="muted">Token data is temporarily unavailable.</p>');</script></body></html>
