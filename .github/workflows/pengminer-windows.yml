name: PengMiner Windows

on:
  push:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/pengminer/**"
      - "client/**"
      - "crates/**"
      - "server/**"
      - ".github/workflows/pengminer-windows.yml"

concurrency:
  group: pengminer-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server checks
    runs-on: windows-2022
    env:
      npm_config_msvs_version: "2022"
      GYP_MSVS_VERSION: "2022"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test server
        working-directory: server
        run: npm ci && npm run build && npm test

  frontend:
    name: Frontend checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pengminer/package-lock.json
      - name: Install desktop dependencies
        working-directory: apps/pengminer
        run: npm ci
      - name: Build, lint, and test frontend
        working-directory: apps/pengminer
        run: npm run build && npm run lint && npm test

  cli:
    name: CLI checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Test CLI
        run: cargo test --locked --manifest-path client/Cargo.toml

  desktop-core:
    name: Desktop core checks
    runs-on: windows-2022
    env:
      npm_config_msvs_version: "2022"
      GYP_MSVS_VERSION: "2022"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pengminer/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build integration test server
        working-directory: server
        run: npm ci && npm run build
      - name: Build integration test engine
        run: cargo build --release --locked --manifest-path client/Cargo.toml
      - name: Test engine subprocess protocol
        run: python client/tests/engine_smoke.py
      - name: Test desktop core
        run: cargo test --locked --manifest-path apps/pengminer/src-tauri/Cargo.toml --no-default-features

  installer:
    name: Windows installer
    needs: [server, frontend, cli, desktop-core]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pengminer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pengminer/src-tauri
      - name: Install desktop dependencies
        working-directory: apps/pengminer
        run: npm ci
      - name: Build Windows installer
        working-directory: apps/pengminer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: PengMiner-Windows-NSIS
          path: apps/pengminer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
